services:
  db:
    image: postgres:16-alpine
    container_name: jobmail-db
    environment:
      POSTGRES_USER: jobmail
      POSTGRES_PASSWORD: jobmail
      POSTGRES_DB: jobmail
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmail"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: jobmail-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://jobmail:jobmail@db:5432/jobmail
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./secrets:/app/secrets
      - ./dashboard:/app/dashboard
    ports:
      - "8000:8000"
      - "8501:8501"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

volumes:
  postgres_data:
